# nov-nas-back 配置模板
# 复制为 config.toml 后按需修改。

[global]
# 并发复制的文件数（默认 4）
concurrency = 4
# 全局限速，单位 MB/s；0 表示不限速
rate_limit_mbps = 20
# 滚动日志输出目录（默认 logs）
log_dir = "logs"
# 保留的快照数量（默认 7）；0 表示不自动裁剪
keep_snapshots = 7
# 变化率门禁阈值：被修改文件占已有文件的比例超过该值则中止备份（默认 0.3）；0 表示禁用
change_rate_threshold = 0.3
# 变化率门禁绝对值兜底：被修改文件数达到该值才可能触发（默认 100）
min_changed_files = 100
# 内容校验级别："size" 仅元数据 | "sample" 采样哈希（默认）| "full" 全量哈希
verify = "sample"

# 每个 [[jobs]] 定义一个备份任务（源 → 目标）。
# 源为群晖 NAS 共享文件夹的 UNC 路径；认证使用 Windows 凭据管理器已存凭据。
# 注意：Windows 路径请用单引号包裹，避免 TOML 反斜杠转义问题。
[[jobs]]
name = "photo"
source = '\\192.168.1.10\photo\2025'
dest   = 'D:\backup\photo'

[[jobs]]
name = "docs"
source = '\\nas\documents'
dest   = 'D:\backup\docs'
